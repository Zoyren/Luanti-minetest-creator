[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luanti-creator-studio"
version = "0.1.0"
description = "Éditeur visuel professionnel de création de jeux et de mods pour Luanti / Minetest"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Luanti Creator Studio Team"}
]
dependencies = [
    "PySide6>=6.6.0",
    "PySide6-Addons>=6.6.0",
    "Pillow>=10.2.0",
    "numpy>=1.26.0",
    "Panda3D>=1.10.14",
    "trimesh>=4.1.0",
    "pygltflib>=1.16.1",
    "Pygments>=2.17.2",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]